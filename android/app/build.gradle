plugins {
    id "com.android.application"
}

def localSigning = new Properties()
def localSigningFile = rootProject.file("signing.local.env")
if (localSigningFile.exists()) {
    localSigningFile.withInputStream { localSigning.load(it) }
}

android {
    namespace "com.zendriftcruise.app"
    compileSdk 37

    defaultConfig {
        applicationId "com.zendriftcruise.app"
        minSdk 23
        targetSdk 35
        versionCode 32
        versionName "1.4.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("zen-drift-release.jks")
            storePassword localSigning.getProperty("KEYSTORE_PASSWORD")
            keyAlias "zen-drift-cruise"
            keyPassword localSigning.getProperty("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
