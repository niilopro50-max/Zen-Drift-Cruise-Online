name: Build Zen Drift Cruise for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "game/**"
      - "downloads/zen-drift-cruise-android.apk"
      - "server.ts"
      - "widgetKit.ts"
      - "package.json"
      - "package-lock.json"
      - "manifest.json"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[web-only]')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop server
        run: npm run desktop:build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Zen-Drift-Cruise-Windows
          path: release-build/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows installer to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-build -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created." }
          $target = Join-Path $installer.DirectoryName "Zen.Drift.Cruise.Setup.1.3.0.exe"
          Move-Item $installer.FullName $target -Force
          gh release view v1.3.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.3.0 --repo $env:GITHUB_REPOSITORY --title "Zen Drift Cruise 1.3.0" --notes "Sets one lower speed cap and balanced acceleration for all cars and devices."
            if ($LASTEXITCODE -ne 0) {
              gh release view v1.3.0 --repo $env:GITHUB_REPOSITORY *> $null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or find release v1.3.0." }
            }
          }
          gh release upload v1.3.0 $target --repo $env:GITHUB_REPOSITORY --clobber
