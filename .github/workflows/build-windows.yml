name: Build Zen Drift Cruise for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "game/**"
      - "server.ts"
      - "widgetKit.ts"
      - "package.json"
      - "package-lock.json"
      - "manifest.json"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop server
        run: npm run desktop:build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Zen-Drift-Cruise-Windows
          path: release-build/*.exe
          if-no-files-found: error
          retention-days: 30
