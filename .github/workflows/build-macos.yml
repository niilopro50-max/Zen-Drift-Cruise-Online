name: Build Zen Drift Cruise for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "game/**"
      - "downloads/zen-drift-cruise-android.apk"
      - "server.ts"
      - "widgetKit.ts"
      - "package.json"
      - "package-lock.json"
      - "manifest.json"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop server
        run: npm run desktop:build

      - name: Build Apple Silicon installer
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            gh release create v1.2.9 --repo "$GITHUB_REPOSITORY" --title "Zen Drift Cruise 1.2.9" --notes "Adds Rally RS and Hyper GT sports cars to the garage, with new designs and handling for all versions." || \
              gh release view v1.2.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          }

      - name: Publish installer to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(find release-build -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "macOS DMG was not created."
            exit 1
          fi
          asset="release-build/Zen.Drift.Cruise-1.2.9-arm64.dmg"
          mv "$dmg" "$asset"
          gh release upload v1.2.9 "$asset" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish signed Android installer to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="downloads/zen-drift-cruise-android.apk"
          if [ ! -f "$apk" ]; then
            echo "Signed Android APK was not found."
            exit 1
          fi
          gh release upload v1.2.9 "$apk" --repo "$GITHUB_REPOSITORY" --clobber
